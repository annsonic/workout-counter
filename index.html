<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙人輪替教練計時器</title>
    <link rel="stylesheet" href="tailwind.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', "Microsoft JhengHei", sans-serif;
        }

        .progress-segment {
            transition: all 0.3s ease;
        }

        .timer-glow {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        input.input-error {
            border: 2px solid #A06060 !important;
        }

        :root {
            --bg-base: #18181B;
            --bg-card: #232326;
            --bg-input: #2E2E32;
            --color-accent: #7A9BB5;
            --color-muted: #8A8A8E;
            --color-label: #B0B0B5;
            --btn-primary: #4A6478;
            --btn-primary-h: #5a7a94;

            --bg-prep: #3D2E28;
            --bg-work: #2E4039;
            --chip-work-bg: #4A7060;
            --chip-work-text: #9EDBC4;
            --chip-prep-bg: #6A4E44;
            --chip-prep-text: #E8A898;
            --text-primary: #EEEAE5;
            --text-done: #DDD9D4;
            --text-muted-round: #9A9690;
            --text-muted-sets: #6A6660;
            --timer-warning: #E8A898;
        }

        body.screen-setup {
            background-color: var(--bg-base);
        }

        body.screen-prep {
            background-color: var(--bg-prep);
            transition: background-color 0.7s ease;
        }

        body.screen-work {
            background-color: var(--bg-work);
            transition: background-color 0.7s ease;
        }

        body.screen-finished {
            background-color: var(--bg-base);
            transition: background-color 0.7s ease;
        }

        /* ── 設定畫面元件 ── */
        #setup-screen {
            background-color: var(--bg-card);
            border-radius: 24px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        #setup-screen h1 {
            color: var(--color-accent);
            font-size: 26px;
            font-weight: 900;
        }

        #setup-screen label {
            color: var(--color-muted);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        #setup-screen input[type="number"] {
            background-color: var(--bg-input);
            color: #e0e0e0;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            padding-top: 14px;
            padding-bottom: 14px;
        }

        #setup-screen input[type="number"]:focus {
            outline: 2px solid var(--color-accent);
            outline-offset: 0px;
        }

        #setup-screen input.input-error:focus {
            outline: none;
            border: 2px solid #A06060 !important;
        }

        #setup-screen .field-error {
            color: #C08080;
            font-size: 12px;
        }

        #total-time-label {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--color-label);
            font-weight: 600;
            font-size: 14px;
            border-radius: 12px;
        }

        #start-btn {
            background-color: var(--btn-primary);
            transition: background-color 0.2s, transform 0.1s;
            font-weight: 900;
            font-size: 20px;
            border-radius: 16px;
            padding-top: 18px;
            padding-bottom: 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }

        #start-btn:hover {
            background-color: var(--btn-primary-h);
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        /* ══════════════ 計時畫面 ══════════════ */

        #timer-screen {
            justify-content: space-between;
        }

        #round-label {
            color: var(--text-muted-round);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        #sets-label {
            color: var(--text-muted-sets);
            font-weight: 500;
            font-size: 12px;
        }

        #progress-bar-container {
            gap: 4px;
        }

        .progress-track {
            flex: 1;
            height: 6px;
            margin: 0 2px;
            border-radius: 3px;
            background-color: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            background-color: rgba(255, 255, 255, 0.55);
            transition: width 0.4s ease, opacity 0.4s ease;
        }

        #display-id {
            font-size: 7.5rem;
            font-weight: 900;
            color: var(--text-primary);
            line-height: 1;
        }

        #display-id.done {
            font-size: 6rem;
            color: var(--text-done);
        }

        #sub-label {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            margin-top: 6px;
        }

        #finished-label {
            font-size: 16px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            margin-top: 12px;
            display: none;
        }

        #phase-chip {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 2px;
            border-width: 2px;
            border-style: solid;
            margin-top: 20px;
        }

        #phase-chip.phase-work {
            background-color: rgba(74, 112, 96, 0.45);
            border-color: rgba(74, 112, 96, 0.85);
            color: var(--chip-work-text);
        }

        #phase-chip.phase-prep {
            background-color: rgba(106, 78, 68, 0.45);
            border-color: rgba(106, 78, 68, 0.85);
            color: var(--chip-prep-text);
        }

        #countdown {
            font-size: 4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-done);
            margin-top: 14px;
            transition: color 0.3s ease;
        }

        #countdown.warning {
            color: var(--timer-warning);
        }

        #controls-area {
            width: 100%;
            max-width: 480px;
            padding: 0 24px;
        }

        #pause-btn {
            width: 100%;
            height: 88px;
            border-radius: 20px;
            background-color: #3A3A3E;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-done);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.18s ease, border-color 0.18s ease;
        }

        #pause-btn.is-paused {
            background-color: #4A6A5A;
            border-color: rgba(255, 255, 255, 0.12);
        }

        #pause-btn .pause-play-icon {
            font-size: 2.8rem;
            line-height: 1;
        }

        #restart-btn {
            width: 100%;
            height: 88px;
            border-radius: 20px;
            background-color: #4A6A5A;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-done);
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #secondary-row {
            display: flex;
            gap: 12px;
            margin-top: 14px;
        }

        .secondary-btn {
            flex: 1;
            height: 52px;
            border-radius: 14px;
            background-color: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-muted-round);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .secondary-btn:hover:not(:disabled) {
            background-color: rgba(255, 255, 255, 0.09);
        }

        .secondary-btn:disabled {
            background-color: rgba(255, 255, 255, 0.02);
            color: #3E3E42;
            cursor: not-allowed;
        }

        .secondary-btn .icon {
            font-size: 20px;
        }

        #adjust-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #adjust-hint {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            text-align: center;
            margin-top: 5px;
            display: none;
        }

        /* ── 結束訓練確認對話框 ── */
        #confirm-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 60;
            padding: 16px;
        }

        #confirm-dialog {
            width: 100%;
            max-width: 340px;
            background-color: #1E1E21;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 28px 24px 20px;
        }

        #confirm-dialog h2 {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin: 0 0 8px;
        }

        #confirm-dialog p {
            color: var(--text-muted-round);
            font-size: 14px;
            font-weight: 500;
            margin: 0 0 28px;
        }

        #confirm-dialog .confirm-actions {
            display: flex;
            gap: 10px;
        }

        #confirm-dialog button {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
        }

        #confirm-cancel {
            background-color: rgba(255, 255, 255, 0.06);
            color: var(--text-muted-round);
            font-weight: 700;
        }

        #confirm-end {
            background-color: #5C2E2E;
            border: 1px solid #8A4848 !important;
            color: var(--timer-warning);
            font-weight: 900;
        }

        /* ══════════════ 調整面板（對齊 Dart _AdjustPanel）══════════════ */

        #adjust-panel .adjust-card {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background-color: var(--bg-card);
            border-radius: 24px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
        }

        #adjust-panel h1 {
            color: var(--color-accent);
            font-size: 26px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 24px;
        }

        #adjust-panel label {
            color: var(--color-muted);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.3px;
        }

        #adjust-panel input[type="number"] {
            background-color: var(--bg-input);
            color: #e0e0e0;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            padding-top: 14px;
            padding-bottom: 14px;
        }

        #adjust-panel input[type="number"]:focus {
            outline: 2px solid var(--color-accent);
            outline-offset: 0px;
        }

        #adjust-panel input.input-error:focus {
            outline: none;
            border: 2px solid #A06060 !important;
        }

        #adjust-panel .field-error {
            color: #C08080;
            font-size: 12px;
        }

        /* 預覽框：一般狀態 */
        #adj-preview {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--color-label);
            font-weight: 600;
            font-size: 14px;
            border-radius: 12px;
            border: 1px solid transparent;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        /* 預覽框：警告狀態（⚠️ 超出範圍） */
        #adj-preview.warning {
            background-color: rgba(160, 64, 48, 0.25);
            color: #E08070;
            border: 1px solid rgba(160, 64, 48, 0.5);
        }

        #adjust-cancel-btn {
            flex: 2;
            background-color: rgba(160, 80, 80, 0.3);
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            border-radius: 16px;
            padding: 18px 0;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }

        #adjust-apply-btn {
            flex: 3;
            background-color: var(--btn-primary);
            color: #fff;
            font-size: 20px;
            font-weight: 900;
            border-radius: 16px;
            padding: 18px 0;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }

        #adjust-apply-btn:hover {
            background-color: var(--btn-primary-h);
        }
    </style>
</head>

<body class="screen-setup text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 設定畫面 -->
    <div id="setup-screen" class="w-full" style="max-width:420px;padding:32px;">
        <h1 class="text-center mb-6">訓練參數設定</h1>

        <div class="space-y-4">
            <div>
                <label for="input-rounds" class="block mb-2">動作項目 (Rounds)</label>
                <input type="number" id="input-rounds" min="1" max="99" value="5"
                    class="w-full border-none rounded-xl text-center outline-none" style="padding:14px 12px;"
                    oninput="validateInput(this, 1, 99); updateTotalTime()"
                    onblur="clampInput(this, 1, 99); updateTotalTime()">
                <p id="error-rounds" class="field-error hidden mt-1">請輸入 1 ~ 99 的整數</p>
            </div>

            <div>
                <label for="input-sets" class="block mb-2">單人循環 (Sets)</label>
                <input type="number" id="input-sets" min="1" max="99" value="2"
                    class="w-full border-none rounded-xl text-center outline-none" style="padding:14px 12px;"
                    oninput="validateInput(this, 1, 99); updateTotalTime()"
                    onblur="clampInput(this, 1, 99); updateTotalTime()">
                <p id="error-sets" class="field-error hidden mt-1">請輸入 1 ~ 99 的整數</p>
            </div>

            <div>
                <label for="input-work" class="block mb-2">運動時間 (秒)</label>
                <input type="number" id="input-work" min="10" max="9999" value="40"
                    class="w-full border-none rounded-xl text-center outline-none" style="padding:14px 12px;"
                    oninput="validateInput(this, 10, 9999); updateTotalTime()"
                    onblur="clampInput(this, 10, 9999); updateTotalTime()">
                <p id="error-work" class="field-error hidden mt-1">請輸入 10 ~ 9999 的整數</p>
            </div>
        </div>

        <div id="total-time-label" class="text-center py-3 px-4 mt-6"></div>

        <button id="start-btn" onclick="startApp()" class="w-full text-white mt-6">
            開始訓練
        </button>
    </div>

    <!-- 計時畫面 -->
    <div id="timer-screen" class="hidden w-full h-screen flex flex-col items-center py-5 px-0 fixed inset-0">

        <div class="w-full max-w-xl" style="padding: 14px 24px;">
            <div class="flex justify-between items-center mb-2">
                <span id="round-label">項目 1/5</span>
                <span id="sets-label">Sets 2</span>
            </div>
            <div id="progress-bar-container" class="flex w-full"></div>
        </div>

        <div class="text-center flex flex-col items-center flex-1 justify-center">
            <div id="display-id">1-1</div>
            <div id="sub-label">SET · PLAYER</div>
            <div id="finished-label">訓練完成</div>

            <div id="phase-chip" class="phase-prep">PREP</div>
            <div id="countdown">08</div>
        </div>

        <div id="controls-area" class="mb-6">
            <button id="restart-btn" onclick="handleRestart()">重新開始</button>

            <button id="pause-btn" onclick="togglePause()" title="暫停/繼續" aria-label="暫停或繼續">
                <span class="pause-play-icon" id="pause-play-icon">⏸</span>
            </button>

            <div id="secondary-row">
                <button id="reset-btn" class="secondary-btn" onclick="confirmReset()">
                    <span class="icon">↻</span><span>重置</span>
                </button>
                <div id="adjust-wrap">
                    <button id="adjust-btn" class="secondary-btn" onclick="openAdjustPanel()">
                        <span class="icon">⚙</span><span>調整</span>
                    </button>
                    <div id="adjust-hint">僅在準備期可調整</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 結束訓練確認對話框 -->
    <div id="confirm-overlay">
        <div id="confirm-dialog">
            <h2>結束訓練？</h2>
            <p>目前進度將全部清除。</p>
            <div class="confirm-actions">
                <button id="confirm-cancel" onclick="closeConfirmReset()">繼續訓練</button>
                <button id="confirm-end" onclick="doResetApp()">結束訓練</button>
            </div>
        </div>
    </div>

    <!-- 調整面板（對齊 Dart _AdjustPanel：全螢幕 Scaffold 樣式，卡片直式欄位排列） -->
    <div id="adjust-panel"
        class="hidden fixed inset-0 z-50 text-white min-h-screen flex flex-col items-center justify-center p-4"
        style="background-color: var(--bg-base);">

        <div class="adjust-card">
            <h1>中途調整</h1>

            <div class="space-y-4">
                <div>
                    <label for="adj-rounds" class="block mb-2">動作項目 (Rounds)</label>
                    <input type="number" id="adj-rounds" min="1" max="99"
                        class="w-full border-none rounded-xl text-center outline-none" style="padding:14px 12px;"
                        oninput="validateInput(this, 1, 99); updateAdjPreview()"
                        onblur="clampInput(this, 1, 99); updateAdjPreview()">
                    <p id="error-adj-rounds" class="field-error hidden mt-1">請輸入 1 ~ 99 的整數</p>
                </div>

                <div>
                    <label for="adj-sets" class="block mb-2">單人循環 (Sets)</label>
                    <input type="number" id="adj-sets" min="1" max="99"
                        class="w-full border-none rounded-xl text-center outline-none" style="padding:14px 12px;"
                        oninput="validateInput(this, 1, 99); updateAdjPreview()"
                        onblur="clampInput(this, 1, 99); updateAdjPreview()">
                    <p id="error-adj-sets" class="field-error hidden mt-1">請輸入 1 ~ 99 的整數</p>
                </div>

                <div>
                    <label for="adj-work" class="block mb-2">運動時間 (秒)</label>
                    <input type="number" id="adj-work" min="10" max="9999"
                        class="w-full border-none rounded-xl text-center outline-none" style="padding:14px 12px;"
                        oninput="validateInput(this, 10, 9999); updateAdjPreview()"
                        onblur="clampInput(this, 10, 9999); updateAdjPreview()">
                    <p id="error-adj-work" class="field-error hidden mt-1">請輸入 10 ~ 9999 的整數</p>
                </div>
            </div>

            <div id="adj-preview" class="text-center py-3 px-4 mt-6"></div>

            <div class="flex gap-3 mt-6">
                <button id="adjust-cancel-btn" onclick="closeAdjustPanel()">取消</button>
                <button id="adjust-apply-btn" onclick="applyLiveChanges()">套用</button>
            </div>
        </div>
    </div>

    <script>
        let config = {
            totalRounds: 0,
            setsPerRound: 0,
            prepTime: 8,
            switchPlayerPrepTime: 8,
            workTime: 0
        };
        let state = {
            currentRound: 1,
            currentSet: 1,
            currentPlayer: 1,
            phase: 'PREP',
            timer: 0,
            isPaused: false,
            isFinished: false
        };
        let intervalId = null;
        let finishTimeoutId = null;
        let phaseStartTime = null;
        let phaseDuration = 0;

        let pauseStateBeforeAdjust = false;
        let wasAutoToggled = false;

        const synth = window.speechSynthesis;
        let voices = [];

        function initVoices() {
            voices = synth.getVoices();
            if (synth.onvoiceschanged !== undefined) {
                synth.onvoiceschanged = () => { voices = synth.getVoices(); };
            }
        }
        initVoices();

        function warmUpSpeechSynthesis() {
            const u = new SpeechSynthesisUtterance('');
            u.rate = 1.5;
            u.lang = 'zh-TW';
            synth.speak(u);
        }

        window.addEventListener('load', () => {
            setTimeout(warmUpSpeechSynthesis, 500);
        });

        // ─── 輸入驗證 ───────────────────────────────────────────────────

        function validateInput(input, min, max) {
            const val = parseInt(input.value);
            const inputId = input.id;
            let errorId;
            if (inputId.startsWith('input-')) {
                errorId = 'error-' + inputId.replace('input-', '');
            } else if (inputId.startsWith('adj-')) {
                errorId = 'error-' + inputId;
            }
            const errorEl = document.getElementById(errorId);
            const isInvalid = isNaN(val) || val < min || val > max;
            if (isInvalid) {
                input.classList.add('input-error');
                if (errorEl) errorEl.classList.remove('hidden');
            } else {
                input.classList.remove('input-error');
                if (errorEl) errorEl.classList.add('hidden');
            }
        }

        function clampInput(input, min, max) {
            let val = parseInt(input.value);
            if (isNaN(val) || val < min) val = min;
            if (val > max) val = max;
            input.value = val;
            input.classList.remove('input-error');
            const inputId = input.id;
            let errorId;
            if (inputId.startsWith('input-')) {
                errorId = 'error-' + inputId.replace('input-', '');
            } else if (inputId.startsWith('adj-')) {
                errorId = 'error-' + inputId;
            }
            const errorEl = document.getElementById(errorId);
            if (errorEl) errorEl.classList.add('hidden');
        }

        function updateTotalTime() {
            const rounds = parseInt(document.getElementById('input-rounds').value) || 0;
            const sets = parseInt(document.getElementById('input-sets').value) || 0;
            const workTime = parseInt(document.getElementById('input-work').value) || 0;
            const prepTime = 8;
            const totalSeconds = (prepTime + workTime) * 2 * sets * rounds;
            const label = document.getElementById('total-time-label');
            if (rounds === 0 || sets === 0 || workTime === 0) {
                label.textContent = '總訓練時間：—';
                return;
            }
            if (totalSeconds <= 60) {
                label.textContent = `總訓練時間：約 ${totalSeconds} 秒`;
            } else {
                const minutes = (totalSeconds / 60).toFixed(1);
                label.textContent = `總訓練時間：約 ${minutes} 分鐘`;
            }
        }
        updateTotalTime();

        // ─── 語音 ───────────────────────────────────────────────────────

        function getChineseNumber(num) {
            const chineseNums = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
            return chineseNums[num] || num.toString();
        }

        function speak(msg, rate = 1.5) {
            synth.cancel();
            let u = new SpeechSynthesisUtterance();
            u.text = msg;
            u.rate = rate;
            u.lang = 'zh-TW';
            let targetVoice = null;
            for (let i = 0; i < voices.length; i++) {
                if (voices[i].name.includes("Microsoft HsiaoChen") || voices[i].name.includes("曉臻")) {
                    targetVoice = voices[i]; break;
                }
            }
            if (!targetVoice) {
                for (let i = 0; i < voices.length; i++) {
                    if (voices[i].name.includes("Google 國語") || (voices[i].name.includes("Google") && voices[i].lang.includes("zh-TW"))) {
                        targetVoice = voices[i]; break;
                    }
                }
            }
            if (targetVoice) u.voice = targetVoice;
            synth.speak(u);
        }

        function getPrepPhrase() {
            const r = getChineseNumber(state.currentSet);
            const p = getChineseNumber(state.currentPlayer);
            return `${r}之${p}預備`;
        }

        // ─── 主流程 ──────────────────────────────────────────────────────

        function startApp() {
            clampInput(document.getElementById('input-rounds'), 1, 99);
            clampInput(document.getElementById('input-sets'), 1, 99);
            clampInput(document.getElementById('input-work'), 10, 9999);

            config.totalRounds = parseInt(document.getElementById('input-rounds').value);
            config.setsPerRound = parseInt(document.getElementById('input-sets').value);
            config.workTime = parseInt(document.getElementById('input-work').value);

            state.currentRound = 1;
            state.currentSet = 1;
            state.currentPlayer = 1;
            state.phase = 'PREP';
            state.timer = config.prepTime;
            state.isPaused = false;
            state.isFinished = false;

            phaseDuration = config.prepTime;
            phaseStartTime = Date.now();

            initProgressBar();

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('timer-screen').classList.remove('hidden');
            document.getElementById('sets-label').textContent = `Sets ${config.setsPerRound}`;

            const pauseBtn = document.getElementById('pause-btn');
            pauseBtn.classList.remove('is-paused', 'hidden');
            document.getElementById('pause-play-icon').textContent = '⏸';
            document.getElementById('restart-btn').style.display = 'none';
            document.getElementById('secondary-row').style.display = 'flex';
            document.getElementById('finished-label').style.display = 'none';
            document.getElementById('display-id').classList.remove('done');
            document.getElementById('phase-chip').style.display = 'inline-block';
            document.getElementById('countdown').style.display = 'block';
            document.getElementById('sub-label').style.display = 'block';

            updateUI();
            speak(getPrepPhrase(), 1.2);
            startTimer();
        }

        function startTimer() {
            if (intervalId) clearInterval(intervalId);
            intervalId = setInterval(() => {
                if (!state.isPaused) tick();
            }, 200);
        }

        function tick() {
            const elapsed = Math.floor((Date.now() - phaseStartTime) / 1000);
            const remaining = phaseDuration - elapsed;
            const prevTimer = state.timer;

            if (remaining > 0) {
                state.timer = remaining;
                if (prevTimer !== remaining) {
                    const isInitialPrep =
                        state.phase === 'PREP' &&
                        state.currentRound === 1 &&
                        state.currentSet === 1 &&
                        state.currentPlayer === 1;

                    if (remaining === 6 && state.phase === 'PREP' && !isInitialPrep) {
                        speak(getPrepPhrase(), 1.2);
                    } else if (remaining === 3) {
                        speak("3", 1.6);
                    } else if (remaining === 2) {
                        speak("2", 1.6);
                    } else if (remaining === 1) { speak("1", 1.6); }
                    updateUI();
                }
            } else {
                state.timer = 0;
                moveToNextState();
                updateUI();
            }
        }

        function moveToNextState() {
            if (state.phase === 'PREP') {
                state.phase = 'WORK';
                state.timer = config.workTime;
                phaseDuration = config.workTime;
                phaseStartTime = Date.now();
                speak("開始", 1.2);
            } else {
                let transitionPrompt = "換人";
                if (state.currentPlayer === 1) {
                    state.currentPlayer = 2;
                } else if (state.currentSet < config.setsPerRound) {
                    state.currentSet++;
                    state.currentPlayer = 1;
                } else if (state.currentRound < config.totalRounds) {
                    state.currentRound++;
                    state.currentSet = 1;
                    state.currentPlayer = 1;
                    transitionPrompt = "下一個動作";
                } else {
                    finishTraining();
                    return;
                }
                state.phase = 'PREP';
                state.timer = config.prepTime;
                phaseDuration = config.prepTime;
                phaseStartTime = Date.now();
                speak(transitionPrompt, 1.2);
            }
        }

        function initProgressBar() {
            const container = document.getElementById('progress-bar-container');
            container.innerHTML = '';
            for (let i = 1; i <= config.totalRounds; i++) {
                const track = document.createElement('div');
                track.className = 'progress-track';
                track.innerHTML = `<div id="round-inner-${i}" class="progress-fill" style="width:0%;"></div>`;
                container.appendChild(track);
            }
        }

        function applyBodyBg(phase, finished) {
            document.body.classList.remove('screen-prep', 'screen-work', 'screen-setup', 'screen-finished');
            if (finished) {
                document.body.classList.add('screen-finished');
            } else if (phase === 'WORK') {
                document.body.classList.add('screen-work');
            } else if (phase === 'PREP') {
                document.body.classList.add('screen-prep');
            } else {
                document.body.classList.add('screen-setup');
            }
        }

        function updateUI() {
            const adjustBtn = document.getElementById('adjust-btn');
            const adjustHint = document.getElementById('adjust-hint');
            const canAdjust = !state.isFinished && state.phase === 'PREP';
            adjustBtn.disabled = !canAdjust;
            adjustHint.style.display = (!canAdjust && !state.isFinished) ? 'block' : 'none';

            if (state.isFinished) {
                applyBodyBg(null, true);

                for (let i = 1; i <= config.totalRounds; i++) {
                    const inner = document.getElementById(`round-inner-${i}`);
                    if (!inner) continue;
                    inner.style.width = '100%';
                    inner.style.opacity = '1';
                }

                const displayId = document.getElementById('display-id');
                displayId.textContent = 'DONE';
                displayId.classList.add('done');
                document.getElementById('sub-label').style.display = 'none';
                document.getElementById('finished-label').style.display = 'block';
                document.getElementById('phase-chip').style.display = 'none';
                document.getElementById('countdown').style.display = 'none';

                document.getElementById('pause-btn').classList.add('hidden');
                document.getElementById('secondary-row').style.display = 'none';
                document.getElementById('restart-btn').style.display = 'flex';
                return;
            }

            applyBodyBg(state.phase, false);

            document.getElementById('round-label').textContent = `項目 ${state.currentRound} / ${config.totalRounds}`;
            document.getElementById('sets-label').textContent = `Sets ${config.setsPerRound}`;
            document.getElementById('display-id').textContent = `${state.currentSet}-${state.currentPlayer}`;

            const chip = document.getElementById('phase-chip');
            const countdown = document.getElementById('countdown');
            if (state.phase === 'PREP') {
                chip.textContent = 'PREP';
                chip.classList.remove('phase-work');
                chip.classList.add('phase-prep');
            } else {
                chip.textContent = 'WORK';
                chip.classList.remove('phase-prep');
                chip.classList.add('phase-work');
            }

            countdown.textContent = state.timer.toString().padStart(2, '0');
            countdown.classList.toggle('warning', state.timer <= 3);

            for (let i = 1; i <= config.totalRounds; i++) {
                const inner = document.getElementById(`round-inner-${i}`);
                if (!inner) continue;
                if (i < state.currentRound) {
                    inner.style.width = '100%';
                    inner.style.opacity = '0.3';
                } else if (i === state.currentRound) {
                    const totalUnitsInRound = config.setsPerRound * 2;
                    const completedUnits = ((state.currentSet - 1) * 2) + (state.currentPlayer - 1);
                    const percent = (completedUnits / totalUnitsInRound) * 100;
                    inner.style.width = `${percent}%`;
                    inner.style.opacity = '1';
                } else {
                    inner.style.width = '0%';
                }
            }
        }

        function togglePause() {
            state.isPaused = !state.isPaused;
            const btn = document.getElementById('pause-btn');
            const icon = document.getElementById('pause-play-icon');

            if (state.isPaused) {
                synth.cancel();
                phaseDuration = state.timer;
                icon.textContent = '▶';
            } else {
                phaseStartTime = Date.now();
                icon.textContent = '⏸';
            }

            btn.classList.toggle('is-paused', state.isPaused);
            updateUI();
        }

        // ─── 訓練結束 ─────────────────────────────────────────────────

        function finishTraining() {
            clearInterval(intervalId);
            state.isFinished = true;
            speak("訓練結束", 1.3);
            updateUI();
        }

        function handleRestart() {
            resetApp();
        }

        function resetApp() {
            clearInterval(intervalId);
            if (finishTimeoutId) { clearTimeout(finishTimeoutId); finishTimeoutId = null; }
            synth.cancel();
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('timer-screen').classList.add('hidden');
            document.body.className = "screen-setup text-white min-h-screen flex flex-col items-center justify-center p-4";

            wasAutoToggled = false;
            pauseStateBeforeAdjust = false;
        }

        // ─── 重置確認對話框 ─────────────────────────────────────────────

        function confirmReset() {
            document.getElementById('confirm-overlay').style.display = 'flex';
        }

        function closeConfirmReset() {
            document.getElementById('confirm-overlay').style.display = 'none';
        }

        function doResetApp() {
            closeConfirmReset();
            resetApp();
        }

        // ─── 調整面板（對齊 Dart _AdjustPanel）─────────────────────────

        function openAdjustPanel() {
            if (state.phase !== 'PREP') {
                return;
            }

            pauseStateBeforeAdjust = state.isPaused;

            if (!state.isPaused) {
                togglePause();
                wasAutoToggled = true;
            } else {
                wasAutoToggled = false;
            }

            document.getElementById('adj-rounds').value = config.totalRounds;
            document.getElementById('adj-sets').value = config.setsPerRound;
            document.getElementById('adj-work').value = config.workTime;

            // 重置錯誤狀態顯示
            ['adj-rounds', 'adj-sets', 'adj-work'].forEach(id => {
                document.getElementById(id).classList.remove('input-error');
            });
            ['error-adj-rounds', 'error-adj-sets', 'error-adj-work'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });

            updateAdjPreview();
            document.getElementById('adjust-panel').classList.remove('hidden');
        }

        function closeAdjustPanel() {
            document.getElementById('adjust-panel').classList.add('hidden');

            if (wasAutoToggled && pauseStateBeforeAdjust === false) {
                togglePause();
            }
            wasAutoToggled = false;
            pauseStateBeforeAdjust = false;
        }

        // ── 對齊 Dart _updatePreview：改用 switchPlayerPrepTime，且文字加註「（估算）」 ──
        function updateAdjPreview() {
            const R = parseInt(document.getElementById('adj-rounds').value) || 0;
            const S = parseInt(document.getElementById('adj-sets').value) || 0;
            const W = parseInt(document.getElementById('adj-work').value) || 0;
            const el = document.getElementById('adj-preview');

            if (!R || !S || !W) {
                el.textContent = '—';
                el.classList.remove('warning');
                return;
            }

            const doneUnits =
                (state.currentRound - 1) * config.setsPerRound * 2 +
                (state.currentSet - 1) * 2 +
                (state.currentPlayer - 1);

            const newTotalUnits = R * S * 2;

            if (doneUnits >= newTotalUnits) {
                el.textContent = '⚠️ 目前進度已超出新設定範圍，將直接結束訓練';
                el.classList.add('warning');
                return;
            }

            el.classList.remove('warning');

            const remainingUnitsFromNow = newTotalUnits - doneUnits;
            const currentPhaseRemaining = state.timer;
            const fullUnitsSeconds =
                (remainingUnitsFromNow - 1) * (config.switchPlayerPrepTime + W);
            const totalRemaining = currentPhaseRemaining + fullUnitsSeconds;

            const min = (totalRemaining / 60).toFixed(1);
            el.textContent = `套用後剩餘時間約 ${min} 分鐘（估算）`;
        }

        function applyLiveChanges() {
            clampInput(document.getElementById('adj-rounds'), 1, 99);
            clampInput(document.getElementById('adj-sets'), 1, 99);
            clampInput(document.getElementById('adj-work'), 10, 9999);

            const newRounds = parseInt(document.getElementById('adj-rounds').value);
            const newSets = parseInt(document.getElementById('adj-sets').value);
            const newWork = parseInt(document.getElementById('adj-work').value);

            if (!newRounds || !newSets || !newWork) return;

            const doneUnits =
                (state.currentRound - 1) * config.setsPerRound * 2 +
                (state.currentSet - 1) * 2 +
                (state.currentPlayer - 1);

            const newTotalUnits = newRounds * newSets * 2;

            let needFinish = false;
            if (doneUnits >= newTotalUnits) {
                needFinish = true;
            }

            config.totalRounds = newRounds;
            config.setsPerRound = newSets;
            config.workTime = newWork;

            if (!needFinish) {
                if (state.currentRound > config.totalRounds) {
                    needFinish = true;
                } else if (state.currentSet > config.setsPerRound) {
                    state.currentSet = config.setsPerRound;
                    state.currentPlayer = 2;
                    state.phase = 'PREP';
                    state.timer = 1;
                    phaseDuration = 1;
                    phaseStartTime = Date.now();
                }
            }

            initProgressBar();
            updateUI();

            closeAdjustPanel();

            if (needFinish) {
                finishTraining();
                return;
            }

            if (state.isPaused) {
                togglePause();
            }
        }
    </script>
